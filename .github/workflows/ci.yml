name: CI

on:
  workflow_dispatch:
  push:
    branches: [dev, main, "feature/**"]
  pull_request:
    branches: [dev, main, "feat/style-trials-m5", "feat/style-dna-v1"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Delivery verifies the exact source head, including stacked draft PRs.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Arcticons-Font ships as a git submodule; the build copies the font from it.
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3
        with:
          # v3 defaults to the retired "tools" package, which sdkmanager cannot resolve.
          packages: platform-tools

      - name: Authoritative full unit suite and debug build
        run: python3 scripts/run_compose_regressions.py --group full-suite

      - name: Verify debug APK identity, signature and SHA-256
        run: |
          for apk in app/build/outputs/apk/debug/*.apk; do
            test -s "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > /tmp/renkinai-debug-badging.txt
            cat /tmp/renkinai-debug-badging.txt
            grep -E "^package: name='hu[.]zsombor[.]renkinai[.]dev' " /tmp/renkinai-debug-badging.txt
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
            sha256sum "$apk"
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RenkinAI-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Retain authoritative full-suite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-evidence
          path: build/compose-regressions/
          if-no-files-found: error
