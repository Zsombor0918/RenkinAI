name: Profile form regressions

on:
  pull_request:
    branches: [main, "feat/style-trials-m5", "feat/style-dna-v1"]
    paths:
      - 'app/src/main/kotlin/dev/renkinProject/renkin/ui/**'
      - 'app/src/test/kotlin/dev/renkinProject/renkin/ui/**'
      - 'app/src/test/kotlin/dev/renkinProject/renkin/testing/**'
      - 'app/src/test/java/**'
      - 'app/src/test/resources/**'
      - 'app/src/main/kotlin/dev/renkinProject/renkin/ai/**'
      - 'app/src/main/kotlin/dev/renkinProject/renkin/data/project/**'
      - 'app/src/main/kotlin/dev/renkinProject/renkin/data/transfer/**'
      - 'app/src/main/kotlin/dev/renkinProject/renkin/data/DbApplication.kt'
      - 'app/src/test/kotlin/dev/renkinProject/renkin/ai/**'
      - 'app/src/test/kotlin/dev/renkinProject/renkin/data/**'
      - 'app/schemas/**'
      - 'scripts/run_compose_regressions.py'
      - '.github/workflows/compose-regressions.yml'
      # Final QA evidence commits must retain regression checks on their own SHA.
      - 'docs/qa/**'

permissions:
  contents: read

jobs:
  profile-form-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Run original cases separately, together and the shared form
        run: python3 scripts/run_compose_regressions.py
      - name: Retain exact-head regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-form-regressions
          path: build/compose-regressions/
          if-no-files-found: error
