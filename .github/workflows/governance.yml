name: Governance

on:
  pull_request:
    branches: [main, dev, "feat/style-trials-m5", "feat/style-dna-v1", "feat/ux-flow-stabilization"]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  commit-conventions:
    name: commit-conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all new commits and PR title
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_commit_messages.py --base "$BASE_SHA" --head "$HEAD_SHA" --event-file "$GITHUB_EVENT_PATH"

  documentation-audit:
    name: documentation-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test shared guard logic offline
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Audit PR diff, local links and declared review result
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_docs.py --base "$BASE_SHA" --head "$HEAD_SHA" --event-file "$GITHUB_EVENT_PATH"
