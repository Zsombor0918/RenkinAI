name: Compose diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/test/kotlin/dev/renkinProject/renkin/ui/project/**'
      - 'scripts/run_compose_diagnostics.py'
      - '.github/workflows/compose-diagnostics.yml'

permissions:
  contents: read

jobs:
  isolate-profile-dialog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Record resolved Compose and test dependencies
        run: |
          mkdir -p compose-diagnostics
          ./gradlew :app:dependencies --configuration debugUnitTestRuntimeClasspath --console=plain > compose-diagnostics/dependencies.log
      - name: Run each isolation case with normal idling
        run: python3 scripts/run_compose_diagnostics.py
      - name: Retain full XML, HTML and measured idling state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-diagnostics
          path: compose-diagnostics/
          if-no-files-found: error
